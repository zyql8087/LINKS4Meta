  links_pretrain_input: "F:/LINKS4Meta/demo_code/LINKS-main/output/data_gen_v2_final80k_20260331/diverse_dataset_v2.pkl"
  links_pretrain_cache_output: "F:/LINKS4Meta/demo/outputs/pretrain/links_pretrain_cache.pt"
